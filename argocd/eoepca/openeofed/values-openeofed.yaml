---
configMaps:
  conf: |
    import os

    from openeo_aggregator.config import AggregatorBackendConfig
    _zk_hosts = os.environ.get("ZOOKEEPERNODES", "zk.example:2181")

    config = AggregatorBackendConfig(
        id="openeofed-eoepca",
        capabilities_title="openeofed eoepca",
        aggregator_backends={
            BACKEND_ID_CDSE: "https://openeo.dataspace.copernicus.eu/openeo/1.1/",
            BACKEND_ID_TERRASCOPE: "https://openeo-cdse.vito.be/openeo/1.1/",
        },
        zookeeper_prefix="/openeo/openeofed/",
        partitioned_job_tracking={"zk_hosts": _zk_hosts},
    )
envVars:
  ENV: "prod"
  ZOOKEEPERNODES: openeo-geotrellis-zookeeper.openeo-geotrellis.svc.cluster.local:2181
  OPENEO_BACKEND_CONFIG: "/conf/openeofed.conf.py"
  GUNICORN_CMD_ARGS: "--bind=0.0.0.0:8080 --workers=10 --threads=1 --timeout=900"
existingConfigMaps: false
fullnameOverride: openeofed
image:
  pullPolicy: Always
  repository: vito-docker.artifactory.vgt.vito.be/openeo-aggregator
  tag: latest
replicaCount: 1
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: openeofed.develop.eoepca.org
      paths:
        - path: /.well-known/openeo
          pathType: Prefix
        - path: /openeo
          pathType: Prefix
  tls:
    - secretName: openeofed-cert
      hosts:
        - openeofed.develop.eoepca.org
volumeMounts:
  - mountPath: /conf
    name: openeofed-config
volumes:
  - configMap:
      name: openeofed
      items:
        - key: conf.py
          path: openeofed.conf.py
    name: openeofed-config
